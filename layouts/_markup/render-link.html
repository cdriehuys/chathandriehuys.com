{{ $isExternal := strings.HasPrefix .Destination "http" }}
<a
  {{ if $isExternal }}class="after:ml-0.5 after:content-['_↗']"{{ end -}}
  href="{{ .Destination | safeURL }}"
  {{ with .Title -}}
    title="{{ . }}"
  {{ end }}{{ if $isExternal -}}
    target="_blank" rel="noreferrer"
  {{ end -}}
  >{{ .Text | safeHTML }}</a
>
